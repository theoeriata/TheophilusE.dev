# -----------------------------------------------------------------------------
# Site Configuration: Theophilus Eriata
# -----------------------------------------------------------------------------

baseURL: "https://theophiluse.xiitechnologies.com/"
locale: "en-us"
title: "Theophilus Eriata"
theme: ["PaperMod", "hugo-shortcode-gallery"]

enableInlineShortcodes: true
enableRobotsTXT: true

pagination:
  pagerSize: 10

taxonomies:
  tag: tags

menu:
  main:
    - name: Work
      url: "/projects/"
      weight: 1
    - name: Writing
      url: "/blog/"
      weight: 2
    - name: About
      url: "/about/"
      weight: 3
    - name: Leadership
      url: "/leadership/"
      weight: 4
    - name: Contact
      url: "/contact/"
      weight: 5

params:
  author: "Theophilus Eriata"
  description: "Graphics, simulation, robotics, and AI projects by Theophilus Eriata, a Computer Science student at the University of Calgary."
  googleAnalyticsID: "G-PVVE70X9RZ"
  DateFormat: "January 2, 2006"

  defaultTheme: "light"
  disableThemeToggle: false
  hideFooter: false

  ShowShareButtons: false
  ShowReadingTime: true
  disableSpecial1stPost: true
  disableAnchoredHeadings: false
  disableScrollToTop: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  ShowWordCount: false
  ShowAllPagesInArchive: false

  math: true
  comments: false

  # MainSections controls what appears in Archive and RSS
  MainSections: ["blog", "projects"]

  # Profile mode is disabled because layouts/index.html provides the homepage.
  profileMode:
    enabled: false

  socialIcons:
    - name: Email
      url: "mailto:theophiluse@xiitechnologies.com"
    - name: GitHub
      url: "https://github.com/theoeriata"
    - name: LinkedIn
      url: "https://linkedin.com/in/theophilus-eriata"
    - name: YouTube
      url: "https://www.youtube.com/@TheophilusEriata"
    - name: X
      url: "https://x.com/theoeriata"

  assets:
    favicon: "favicon.ico?v=7cd09d03"
    favicon16x16: "favicon-16x16.png?v=7cd09d03"
    favicon32x32: "favicon-32x32.png?v=7cd09d03"
    apple_touch_icon: "apple-touch-icon.png?v=7cd09d03"
    disableScrollBarStyle: false
    disableFingerprinting: false

  cover:
    hiddenInList: false
    hiddenInSingle: false

  label:
    text: "Theophilus Eriata"
    icon: "favicon.ico"
    iconHeight: 18

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: "github-dark"
    noClasses: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

outputs:
  home: [HTML, RSS, JSON]
