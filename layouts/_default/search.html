{{ define "main" }}
<section class="search-page">
    <header class="page-header">
        <p class="section-label">Explore the notebook</p>
        <h1>Find a thread.</h1>
        <p class="page-description">Search projects and writing by subject, technology, or idea.</p>
    </header>
    <form id="search-form" role="search" action="{{ .RelPermalink }}" data-index="{{ "index.json" | relURL }}">
        <label for="searchInput">What are you looking for?</label>
        <div class="search-field"><input id="searchInput" name="q" type="search" placeholder="Try rendering, robotics, or C++" autocomplete="off" maxlength="100" aria-describedby="search-status"><button type="submit" class="btn-primary">Search</button></div>
    </form>
    <p id="search-status" role="status" aria-live="polite">Loading the search index…</p>
    <ul id="searchResults" aria-label="Search results"></ul>
    <noscript><p>Search requires JavaScript. You can browse the <a href="{{ "archive/" | relURL }}">complete archive</a> or <a href="{{ "tags/" | relURL }}">topics</a> instead.</p></noscript>
</section>
{{ end }}
