{{ define "main" }}
<section class="topics-page">
    <header class="page-header">
        <p class="section-label">Index of ideas</p>
        <h1>Explore by topic.</h1>
        <p class="page-description">Follow a subject across projects and technical writing.</p>
    </header>
    <ul class="terms-tags">
        {{ range .Data.Terms.Alphabetical }}
        <li><a href="{{ .Page.RelPermalink }}"><span>{{ .Page.Title }}</span><span class="term-count">{{ .Count }}<span class="sr-only"> entries</span></span></a></li>
        {{ end }}
    </ul>
</section>
{{ end }}
