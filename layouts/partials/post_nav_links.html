{{ $pages := where site.RegularPages "Section" .Section }}
{{ if and (gt (len $pages) 1) (in $pages .) }}
<nav class="paginav" aria-label="{{ if eq .Section "projects" }}More projects{{ else }}More writing{{ end }}">
    {{ with $pages.Next . }}<a class="prev" href="{{ .RelPermalink }}"><span class="section-label">Previous</span><span>{{ .Title }}</span></a>{{ end }}
    {{ with $pages.Prev . }}<a class="next" href="{{ .RelPermalink }}"><span class="section-label">Next</span><span>{{ .Title }}</span></a>{{ end }}
</nav>
{{ end }}
