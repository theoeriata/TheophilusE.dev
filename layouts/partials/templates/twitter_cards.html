<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | default site.Title }}">
<meta name="twitter:description" content="{{ .Description | default (.Summary | plainify) | default site.Params.description | htmlUnescape }}">
<meta name="twitter:image" content="{{ partial "social-image.html" . }}">
<meta name="twitter:image:alt" content="{{ .Params.cover.alt | default .Title | default site.Title }}">
