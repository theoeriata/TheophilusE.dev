<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:description" content="{{ .Description | default (.Summary | plainify) | default site.Params.description | htmlUnescape }}">
<meta property="og:type" content="{{ if and .IsPage (in site.Params.mainSections .Section) }}article{{ else }}website{{ end }}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ partial "social-image.html" . }}">
<meta property="og:image:alt" content="{{ .Params.cover.alt | default .Title | default site.Title }}">
{{ if and .IsPage (in site.Params.mainSections .Section) }}
<meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ end }}
