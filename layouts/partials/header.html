<script>
try {
    if (localStorage.getItem('pref-theme') === 'dark') document.body.classList.add('dark');
    if (localStorage.getItem('pref-theme') === 'light') document.body.classList.remove('dark');
} catch (_) {}
</script>
<header class="header">
    <nav class="nav" aria-label="Main navigation">
        <div class="logo">
            <a href="{{ site.Home.RelPermalink }}" aria-label="Theophilus Eriata — Home">
                <span class="brand-mark" aria-hidden="true">te<span>.</span></span>
                <span>Theophilus Eriata</span>
            </a>
        </div>
        <ul id="menu">
            {{- $current := . }}
            {{- range site.Menus.main }}
            {{- $active := or (eq $current.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $current.RelPermalink .URL)) }}
            <li><a href="{{ .URL | relLangURL }}"{{ if $active }} aria-current="{{ if eq $current.RelPermalink .URL }}page{{ else }}true{{ end }}"{{ end }}><span{{ if $active }} class="active"{{ end }}>{{ .Name }}</span></a></li>
            {{- end }}
            <li class="mobile-utility"><a href="{{ "search/" | relURL }}">Search</a></li>
            <li class="mobile-utility"><a href="{{ "archive/" | relURL }}">Archive</a></li>
        </ul>
        <div class="logo-switches">
            <a class="nav-search" href="{{ "search/" | relURL }}" aria-label="Search the site" title="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            </a>
            {{- if not site.Params.disableThemeToggle }}
            <button id="theme-toggle" type="button" aria-label="Use dark theme" aria-pressed="false" title="Switch theme">
                <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            </button>
            {{- end }}
            <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </nav>
</header>
