name: Validate Hugo site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate Netlify configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path("netlify.toml").read_text(encoding="utf-8"))
          print("Netlify configuration is valid UTF-8 TOML.")
          PY
      - name: Install Hugo Extended
        run: |
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Production build
        run: hugo --gc --minify
      - name: Check pages, assets, metadata, and internal links
        run: python3 scripts/verify_site.py public
